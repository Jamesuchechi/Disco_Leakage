[project]
name = "disco-leakage"
version = "0.1.0"
description = "Where Nigeria's electricity money leaks: NERC DisCo billing and collection data, cleaned and validated."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pdfplumber>=0.11",
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
