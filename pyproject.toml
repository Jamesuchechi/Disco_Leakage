[project]
name = "disco-leakage"
version = "0.1.0"
description = "Where Nigeria's electricity money leaks: NERC DisCo billing and collection data, cleaned and validated."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pdfplumber>=0.11",
    "pandas>=2.0",
    "pyarrow>=14",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
